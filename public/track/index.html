<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Seguimiento de pedido</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:   #1B5E20;
      --brand-l: #E8F5E9;
      --blue:    #1565C0;
      --blue-l:  #E3F2FD;
      --amber:   #E65100;
      --amber-l: #FFF3E0;
      --grey:    #78909C;
      --grey-l:  #ECEFF1;
      --ok:      #43A047;
      --radius:  14px;
    }

    body {
      background: #F0F2F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* ── Header ── */
    .topbar {
      background: #111;
      color: #fff;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-logo {
      width: 32px; height: 32px;
      background: #fff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .topbar-logo svg { width: 22px; height: 22px; fill: #111; }
    .topbar-info { flex: 1; overflow: hidden; }
    .topbar-title { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
    .topbar-sub   { font-size: 10px; color: #aaa; margin-top: 1px; }

    /* ── Body ── */
    .content { padding: 16px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 10px;
    }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; }
    .pill-pending  { background: var(--amber-l); color: var(--amber); }
    .pill-pending .status-dot { background: var(--amber); animation: pulse 1.4s infinite; }
    .pill-transit  { background: var(--blue-l);  color: var(--blue);  }
    .pill-transit .status-dot { background: var(--blue); animation: pulse 1.4s infinite; }
    .pill-done     { background: var(--brand-l); color: var(--brand); }
    .pill-done .status-dot { background: var(--ok); }
    .pill-grey     { background: var(--grey-l);  color: var(--grey);  }
    .pill-grey .status-dot { background: var(--grey); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Route ── */
    .route-row { display: flex; align-items: flex-start; gap: 10px; }
    .route-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .route-icon svg { width: 18px; height: 18px; }
    .icon-origin { background: var(--blue-l);  } .icon-origin svg  { fill: var(--blue);  }
    .icon-dest   { background: var(--brand-l); } .icon-dest svg    { fill: var(--brand); }
    .route-label { font-size: 9px; color: #999; text-transform: uppercase; letter-spacing: .8px; }
    .route-name  { font-size: 13px; font-weight: 700; color: #111; margin-top: 1px; }
    .route-addr  { font-size: 11px; color: #555; margin-top: 2px; line-height: 1.4; }
    .route-city  { font-size: 11px; color: #888; margin-top: 1px; }
    .route-divider { height: 20px; width: 2px; background: #e0e0e0; margin: 4px 0 4px 15px; }

    /* ── Nav buttons ── */
    .nav-buttons {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .15s;
    }
    .nav-btn:active { opacity: .75; }
    .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-btn-gmaps { background: #E8F0FE; color: #1A73E8; }
    .nav-btn-gmaps svg { fill: #1A73E8; }
    .nav-btn-waze  { background: #E8F8F5; color: #00C2CC; }
    .nav-btn-waze  svg { fill: #00C2CC; }

    /* ── Timeline ── */
    .tl-item { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .tl-item:last-child { margin-bottom: 0; }
    .tl-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      margin-top: 3px;
      flex-shrink: 0;
    }
    .tl-done    { background: var(--ok); }
    .tl-active  { background: var(--amber); box-shadow: 0 0 0 3px rgba(230,81,0,.2); }
    .tl-pending { background: #ddd; }
    .tl-label   { font-size: 12px; font-weight: 600; color: #222; line-height: 1.3; }
    .tl-label.muted  { color: #bbb; font-weight: 400; }
    .tl-label.active { color: var(--amber); }
    .tl-time    { font-size: 10px; color: #aaa; margin-top: 2px; }

    /* ── Products ── */
    .prod-item { display: flex; gap: 8px; font-size: 12px; color: #333; line-height: 1.9; }
    .prod-qty  { font-weight: 700; color: #666; min-width: 24px; }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      left: 20px;
      max-width: 440px;
      margin: 0 auto;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .3px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(27,94,32,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .15s, box-shadow .15s;
    }
    .fab:active { transform: scale(.97); box-shadow: 0 2px 8px rgba(27,94,32,.3); }
    .fab svg { width: 20px; height: 20px; fill: #fff; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 50;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .modal-sheet {
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 36px;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    .modal-backdrop.open .modal-sheet { transform: translateY(0); }

    .modal-handle {
      width: 36px; height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: #111;
      margin-bottom: 4px;
    }
    .modal-sub {
      font-size: 12px;
      color: #888;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .field-label { font-size: 11px; color: #666; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .code-input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 16px;
      text-align: center;
    }
    .code-input:focus { border-color: var(--brand); }
    .btn-confirm {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-confirm:disabled { opacity: .45; cursor: not-allowed; }
    .btn-cancel {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: #888;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* ── States ── */
    .loading, .error-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 14px;
    }
    .error-state { color: #c62828; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #111;
      color: #fff;
      padding: 11px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      transition: transform .3s;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--brand); }
    #toast.error   { background: #c62828; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="topbar" id="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24"><path d="M2 21h18v-2H2v2zm2-4h14l1.5-9H2.5L4 17zm14.5-11H18V4h-2v2h-1.5c-.83 0-1.5.67-1.5 1.5v1c0 .83.67 1.5 1.5 1.5H20c.55 0 1-.45 1-1V7c0-.55-.45-1-1-1h-1.5z"/></svg>
    </div>
    <div class="topbar-info">
      <div class="topbar-title" id="hdr-title">Cargando...</div>
      <div class="topbar-sub"   id="hdr-sub"></div>
    </div>
  </div>

  <!-- Main content -->
  <div class="content" id="main">
    <div class="loading">Cargando información del pedido...</div>
  </div>

  <!-- FAB: Confirmar recepción -->
  <button class="fab" id="fab" style="display:none" onclick="openModal()">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    Confirmar recepción
  </button>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="handleBackdropClick(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">Confirmar recepción</div>
      <div class="modal-sub">Ingresa tu código de aprobación para confirmar que recibiste el pedido correctamente.</div>
      <div class="field-label">Código de aprobación</div>
      <input id="key-input" class="code-input" type="text" placeholder="••••" autocomplete="off" />
      <button class="btn-confirm" id="btn-confirm" onclick="confirmar()">Confirmar recepción</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

<script>
(function () {
  const parts      = location.pathname.split('/').filter(Boolean);
  const businessId = parts[1];
  const pedidoId   = parts[2];

  const STEPS = [
    'Pedido creado',
    'Preparado y despachado',
    'En camino al destino',
    'Entrega confirmada',
    'Recepción confirmada',
  ];
  const PILL_CLASS = ['pill-pending','pill-pending','pill-transit','pill-done','pill-done'];
  const PILL_LABEL = ['Pendiente','Preparando','En camino','Entregado','Recibido'];

  // ── Toast ──
  function toast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    setTimeout(() => t.className = '', 3000);
  }

  // ── Modal ──
  window.openModal = function () {
    document.getElementById('key-input').value = '';
    document.getElementById('modal-backdrop').classList.add('open');
    setTimeout(() => document.getElementById('key-input').focus(), 300);
  };
  window.closeModal = function () {
    document.getElementById('modal-backdrop').classList.remove('open');
  };
  window.handleBackdropClick = function (e) {
    if (e.target === document.getElementById('modal-backdrop')) closeModal();
  };

  // ── Confirm recepción ──
  window.confirmar = async function () {
    const key = (document.getElementById('key-input').value || '').trim();
    if (!key) { toast('Ingresa tu código de aprobación', 'error'); return; }

    const btn = document.getElementById('btn-confirm');
    btn.disabled = true;
    btn.textContent = 'Confirmando...';

    try {
      const resp = await fetch('/api/track/' + businessId + '/' + pedidoId + '/confirmar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo: 'recepcion', keyAprobacion: key }),
      });
      const data = await resp.json();

      if (!resp.ok) {
        toast(data.error || 'Código incorrecto', 'error');
        btn.disabled = false;
        btn.textContent = 'Confirmar recepción';
        return;
      }

      closeModal();
      toast('¡Recepción confirmada!', 'success');
      document.getElementById('fab').style.display = 'none';
      setTimeout(load, 1200);
    } catch {
      toast('Error de conexión', 'error');
      btn.disabled = false;
      btn.textContent = 'Confirmar recepción';
    }
  };

  // ── SVG icons ──
  const svgPin   = '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>';
  const svgTruck = '<svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>';
  const svgGmaps = '<svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>';
  const svgWaze  = '<svg viewBox="0 0 24 24"><path d="M12.003 2C6.477 2 2 6.477 2 12.003c0 2.4.857 4.6 2.27 6.316L3.158 21l2.78-.994A9.943 9.943 0 0 0 12.003 22C17.528 22 22 17.528 22 12.003 22 6.477 17.528 2 12.003 2zm0 1.8a8.2 8.2 0 1 1 0 16.4 8.2 8.2 0 0 1 0-16.4zm-3.2 5.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm6.4 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zm-3.2 3.6c-1.77 0-3.3 1.04-3.96 2.54h7.92c-.66-1.5-2.19-2.54-3.96-2.54z"/></svg>';

  // ── Render ──
  function render(data) {
    const { id, fecha, hora, estado, timelineStep, tipoEnvio, origen, destino, productos } = data;

    document.getElementById('hdr-title').textContent = 'Pedido #' + id;
    document.getElementById('hdr-sub').textContent   = (origen.nombre || '') + ' · ' + (fecha || '');

    const main = document.getElementById('main');
    main.innerHTML = '';

    // 1. Status pill
    const pillCard = el('div', 'card');
    pillCard.innerHTML =
      '<span class="status-pill ' + (PILL_CLASS[timelineStep] || 'pill-grey') + '">' +
        '<span class="status-dot"></span>' +
        (PILL_LABEL[timelineStep] || estado) +
      '</span>';
    main.appendChild(pillCard);

    // 2. Route + navegación  —  comportamiento según tipoEnvio
    const tipo      = (tipoEnvio || '').toUpperCase();
    const destAddr  = [destino.direccion, destino.ciudad].filter(Boolean).join(', ');
    const origAddr  = [origen.direccion,  origen.ciudad ].filter(Boolean).join(', ');

    let mapsUrl, wazeUrl, routeHtml;

    if (tipo === 'SEDE') {
      const destQ = encodeURIComponent(destAddr || origen.nombre);
      mapsUrl   = 'https://www.google.com/maps/search/?api=1&query=' + destQ;
      wazeUrl   = 'https://waze.com/ul?q=' + destQ + '&navigate=yes';
      routeHtml =
        '<div class="card-title">Punto de recojo</div>' +
        routeRow('dest', svgPin, 'RETIRO EN SEDE', destino.nombre || destino.direccion || origen.nombre, destino.direccion, destino.ciudad);

    } else if (tipo === 'NACIONAL') {
      const origQ = encodeURIComponent(origAddr || origen.nombre);
      const destQ = encodeURIComponent(destAddr || 'Lima, Peru');
      mapsUrl   = 'https://www.google.com/maps/dir/?api=1&origin=' + origQ + '&destination=' + destQ;
      wazeUrl   = 'https://waze.com/ul?q=' + destQ + '&navigate=yes';
      routeHtml =
        '<div class="card-title">Ruta de envío nacional</div>' +
        routeRow('origin', svgPin,   'ORIGEN',         origen.nombre,                   origen.direccion, origen.ciudad) +
        '<div class="route-divider"></div>' +
        routeRow('dest',   svgTruck, 'AGENCIA COURIER', destino.nombre || destino.direccion || 'Agencia de envío', destino.nombre ? destino.direccion : '', destino.ciudad);

    } else {
      // LOCAL o sin tipo
      const origQ = encodeURIComponent(origAddr || origen.nombre);
      const destQ = encodeURIComponent(destAddr || 'Lima, Peru');
      mapsUrl   = 'https://www.google.com/maps/dir/?api=1&origin=' + origQ + '&destination=' + destQ;
      wazeUrl   = 'https://waze.com/ul?q=' + destQ + '&navigate=yes';
      routeHtml =
        '<div class="card-title">Ruta de entrega</div>' +
        routeRow('origin', svgPin,   'ORIGEN',  origen.nombre,                      origen.direccion, origen.ciudad) +
        '<div class="route-divider"></div>' +
        routeRow('dest',   svgTruck, 'DESTINO', destino.nombre || destino.direccion || 'Domicilio', destino.nombre ? destino.direccion : '', destino.ciudad);
    }

    const routeCard = el('div', 'card');
    routeCard.innerHTML =
      routeHtml +
      '<div class="nav-buttons">' +
        '<a class="nav-btn nav-btn-gmaps" href="' + mapsUrl + '" target="_blank">' +
          svgGmaps + 'Google Maps' +
        '</a>' +
        '<a class="nav-btn nav-btn-waze" href="' + wazeUrl + '" target="_blank">' +
          svgWaze + 'Waze' +
        '</a>' +
      '</div>';
    main.appendChild(routeCard);

    // 3. Timeline
    const tlCard = el('div', 'card');
    tlCard.innerHTML = '<div class="card-title">Estado del pedido</div>';
    STEPS.forEach((label, i) => {
      const done   = i < timelineStep;
      const active = i === timelineStep;
      const dotCls = done ? 'tl-done' : active ? 'tl-active' : 'tl-pending';
      const lblCls = done ? 'tl-label' : active ? 'tl-label active' : 'tl-label muted';
      const time   = done ? (i === 0 ? fecha + ' · ' + hora : 'Completado') : active ? 'Ahora' : '—';
      tlCard.innerHTML +=
        '<div class="tl-item">' +
          '<div class="tl-dot ' + dotCls + '"></div>' +
          '<div><div class="' + lblCls + '">' + label + '</div>' +
          '<div class="tl-time">' + time + '</div></div>' +
        '</div>';
    });
    main.appendChild(tlCard);

    // 4. Products
    const prodCard = el('div', 'card');
    prodCard.innerHTML = '<div class="card-title">Productos</div>';
    (productos || []).forEach(p => {
      prodCard.innerHTML +=
        '<div class="prod-item"><span class="prod-qty">' + p.cantidad + 'x</span>' + esc(p.nombre) + '</div>';
    });
    main.appendChild(prodCard);

    // 5. FAB: show only if not yet confirmed
    const fab = document.getElementById('fab');
    fab.style.display = timelineStep < 4 ? 'flex' : 'none';
  }

  // ── Load ──
  async function load() {
    try {
      const resp = await fetch('/api/track/' + businessId + '/' + pedidoId);
      if (!resp.ok) {
        const e = await resp.json().catch(() => ({}));
        document.getElementById('main').innerHTML =
          '<div class="error-state">No se encontró el pedido.<br><small>' + esc(e.error || '') + '</small></div>';
        return;
      }
      render(await resp.json());
    } catch {
      document.getElementById('main').innerHTML =
        '<div class="error-state">Error de conexión. Verifica tu red.</div>';
    }
  }

  // ── Helpers ──
  function el(tag, cls) { const d = document.createElement(tag); d.className = cls; return d; }
  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function routeRow(type, icon, label, name, addr, city) {
    return '<div class="route-row">' +
      '<div class="route-icon icon-' + (type === 'origin' ? 'origin' : 'dest') + '">' + icon + '</div>' +
      '<div>' +
        '<div class="route-label">' + label + '</div>' +
        '<div class="route-name">' + esc(name) + '</div>' +
        (addr ? '<div class="route-addr">' + esc(addr) + '</div>' : '') +
        (city ? '<div class="route-city">' + esc(city) + '</div>' : '') +
      '</div></div>';
  }

  if (!businessId || !pedidoId) {
    document.getElementById('main').innerHTML =
      '<div class="error-state">URL inválida. Escanea el QR del ticket.</div>';
  } else {
    load();
  }
})();
</script>
</body>
</html>
